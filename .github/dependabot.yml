version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "vite-plugin-electron*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      lucide:
        patterns:
          - "lucide-react"
      monaco:
        patterns:
          - "monaco-editor"
          - "@monaco-editor/*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
